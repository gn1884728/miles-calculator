<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Miles App Icon Generator</title>
  <style>
    body {
      background: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
    canvas {
      border-radius: 96px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
      margin-bottom: 20px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>

  <canvas id="iconCanvas" width="512" height="512"></canvas>
  <button onclick="downloadIcon()">下載完美比例 icon.png (512x512)</button>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    // 1. 質感深藍漸層背景
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#1e3a8a');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    // 2. 繪製流線立體客機 (調整角度讓機頭仰角更自然流暢)
    ctx.save();
    ctx.translate(245, 215);
    ctx.rotate(-Math.PI / 6); // 降低仰角至約 30 度，平穩大氣

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    // 機身尖端與流線造型
    ctx.moveTo(0, -100);
    ctx.bezierCurveTo(10, -60, 14, 0, 16, 45);
    // 右機翼
    ctx.lineTo(80, 85);
    ctx.lineTo(60, 100);
    ctx.lineTo(14, 70);
    // 機身尾部
    ctx.lineTo(0, 90);
    // 左機翼
    ctx.lineTo(-14, 70);
    ctx.lineTo(-60, 100);
    ctx.lineTo(-80, 85);
    ctx.lineTo(-16, 45);
    ctx.bezierCurveTo(-14, 0, -10, -60, 0, -100);
    ctx.closePath();
    ctx.fill();

    // 立體機腹光影線
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.moveTo(0, -50);
    ctx.lineTo(0, 50);
    ctx.lineTo(4, 30);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // 3. 繪製 "Miles" 現代風白色粗體字
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 72px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Miles', 256, 420);

    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
